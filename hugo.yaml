baseURL: "https://pharmtech.metacog.co.kr/"
title: "Texas PharmTech"
languageCode: "ko-kr"
defaultContentLanguage: "ko"

enableRobotsTXT: true
enableInlineShortcodes: true
hasCJKLanguage: true

module:
  imports:
    - path: github.com/imfing/hextra

outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML, RSS]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

menu:
  main:
    - name: "학습 가이드"
      pageRef: "/docs"
      weight: 1
    - name: "자격증"
      pageRef: "/docs/certification"
      weight: 2
    - name: "취업"
      pageRef: "/docs/jobs"
      weight: 3
    - name: "자료실"
      pageRef: "/docs/resources"
      weight: 4
    - name: "검색"
      weight: 5
      params:
        type: search
    - name: "GitHub"
      weight: 6
      url: "https://github.com/jeonck/pharmTech"
      params:
        icon: github

  sidebar:
    - identifier: more
      name: "바로가기"
      params:
        type: separator
      weight: 1
    - identifier: ptcb
      name: "PTCB 공식 사이트 ↗"
      url: "https://www.ptcb.org/"
      weight: 2
    - identifier: tsbp
      name: "텍사스 약사위원회(TSBP) ↗"
      url: "https://www.pharmacy.texas.gov/"
      weight: 3
    - identifier: nha
      name: "NHA ExCPT ↗"
      url: "https://www.nhanow.com/certifications/pharmacy-technician"
      weight: 4

params:
  description: "텍사스 Pharmacy Technician(약국 테크니션) 자격증 취득과 취업을 위한 한국어 학습·취업 가이드"
  updated: "2026-08"

  navbar:
    displayTitle: true
    displayLogo: false

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: true
    width: normal

  page:
    width: normal

  editURL:
    enable: false

  blog:
    list:
      displayTags: true

  toc:
    displayTags: true

  mermaid:
    base: "https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist"

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
      version: "0.8.212"
