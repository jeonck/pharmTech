{{- $exam := site.Data.exam -}}
<script type="application/json" id="pt-exam-data">{{ $exam | jsonify | safeJS }}</script>
{{- with resources.Get "js/exam.js" }}
<script>{{ .Content | safeJS }}</script>
{{- end }}
{{- with resources.Get "js/quiz-gen.js" }}
<script>{{ .Content | safeJS }}</script>
{{- end }}

<style>
.mex { --mx-bd:#e2e6ee; --mx-bg:#fff; --mx-mut:#6b7280; --mx-acc:#1b4fd8; --mx-ok:#0f7b4f; --mx-okbg:#e8f7f0; --mx-no:#b91c1c; --mx-nobg:#fdecec; --mx-soft:#f6f8fc; --mx-flag:#b45309; --mx-flagbg:#fff4e5; }
:is(.dark) .mex { --mx-bd:#333940; --mx-bg:#1b1f24; --mx-mut:#9aa3af; --mx-acc:#7aa2ff; --mx-ok:#4ade80; --mx-okbg:#10291f; --mx-no:#f87171; --mx-nobg:#2c1618; --mx-soft:#22272e; --mx-flag:#f0c674; --mx-flagbg:#33270f; }
.mex { margin-top:1rem; }
.mex button { font:inherit; cursor:pointer; }

.mx-start { border:1px solid var(--mx-bd); border-radius:.6rem; background:var(--mx-bg); padding:1.2rem; }
.mx-modes { display:grid; grid-template-columns:repeat(auto-fit,minmax(13rem,1fr)); gap:.6rem; }
.mx-mode { text-align:left; padding:.8rem .9rem; border:1px solid var(--mx-bd); border-radius:.5rem; background:var(--mx-bg); color:inherit; }
.mx-mode:hover { border-color:var(--mx-acc); }
.mx-mode b { display:block; font-size:.95rem; margin-bottom:.2rem; }
.mx-mode small { color:var(--mx-mut); font-size:.78rem; line-height:1.5; }
.mx-sub { margin-top:1rem; display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; }
.mx-chip { padding:.3rem .7rem; border:1px solid var(--mx-bd); border-radius:2rem; background:var(--mx-bg); color:inherit; font-size:.8rem; }
.mx-hist { margin-top:1rem; font-size:.8rem; color:var(--mx-mut); line-height:1.7; }

.mx-bar { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; padding:.6rem .8rem; border:1px solid var(--mx-bd); border-radius:.5rem; background:var(--mx-soft); margin-bottom:.8rem; }
.mx-time { font-variant-numeric:tabular-nums; font-weight:700; font-size:1.05rem; }
.mx-time.warn { color:var(--mx-no); }
.mx-meta { font-size:.8rem; color:var(--mx-mut); }

.mx-card { border:1px solid var(--mx-bd); border-radius:.6rem; background:var(--mx-bg); padding:1.1rem 1.2rem; }
.mx-top { display:flex; justify-content:space-between; gap:1rem; font-size:.78rem; color:var(--mx-mut); margin-bottom:.5rem; }
.mx-q { font-size:1.02rem; font-weight:600; line-height:1.6; margin:.3rem 0 1rem; word-break:keep-all; }
.mx-opts { display:grid; gap:.45rem; }
.mx-opt { display:flex; gap:.6rem; align-items:flex-start; text-align:left; padding:.6rem .8rem; border:1px solid var(--mx-bd); border-radius:.45rem; background:var(--mx-bg); color:inherit; line-height:1.55; word-break:keep-all; }
.mx-opt b { flex:none; width:1.3rem; height:1.3rem; border-radius:.25rem; background:var(--mx-soft); color:var(--mx-mut); font-size:.72rem; display:flex; align-items:center; justify-content:center; margin-top:.1rem; }
.mx-opt:hover { border-color:var(--mx-acc); }
.mx-opt.sel { border-color:var(--mx-acc); background:var(--mx-soft); }
.mx-opt.sel b { background:var(--mx-acc); color:#fff; }
.mx-opt.ok { border-color:var(--mx-ok); background:var(--mx-okbg); }
.mx-opt.ok b { background:var(--mx-ok); color:#fff; }
.mx-opt.no { border-color:var(--mx-no); background:var(--mx-nobg); }
.mx-opt.no b { background:var(--mx-no); color:#fff; }

.mx-nav { display:flex; justify-content:space-between; gap:.5rem; margin-top:1rem; flex-wrap:wrap; }
.mx-btn { padding:.45rem 1rem; border-radius:.4rem; border:1px solid var(--mx-acc); background:var(--mx-acc); color:#fff; font-weight:600; font-size:.88rem; }
.mx-btn.ghost { background:transparent; color:var(--mx-acc); }
.mx-btn.flag { border-color:var(--mx-flag); color:var(--mx-flag); background:transparent; }
.mx-btn.flag.on { background:var(--mx-flagbg); }
.mx-btn:disabled { opacity:.4; cursor:default; }

.mx-pal { display:flex; flex-wrap:wrap; gap:.25rem; margin-top:1rem; }
.mx-p { width:1.9rem; height:1.9rem; border-radius:.3rem; border:1px solid var(--mx-bd); background:var(--mx-bg); color:var(--mx-mut); font-size:.72rem; padding:0; }
.mx-p.done { background:var(--mx-soft); color:inherit; border-color:var(--mx-acc); }
.mx-p.flag { border-color:var(--mx-flag); color:var(--mx-flag); }
.mx-p.cur { outline:2px solid var(--mx-acc); outline-offset:1px; }

.mx-res { text-align:center; padding:.5rem 0 1rem; }
.mx-score { font-size:2.6rem; font-weight:800; line-height:1.1; }
.mx-score.pass { color:var(--mx-ok); }
.mx-score.fail { color:var(--mx-no); }
.mx-scale { font-size:.9rem; color:var(--mx-mut); margin-top:.3rem; }
.mx-dom { display:grid; gap:.4rem; margin-top:1rem; }
.mx-drow { display:flex; align-items:center; gap:.6rem; font-size:.85rem; }
.mx-drow span:first-child { flex:0 0 9rem; }
.mx-dbar { flex:1; height:7px; border-radius:4px; background:var(--mx-soft); overflow:hidden; }
.mx-dbar i { display:block; height:100%; background:var(--mx-acc); }
.mx-dbar i.low { background:var(--mx-no); }
.mx-rv { border:1px solid var(--mx-bd); border-left:3px solid var(--mx-no); border-radius:0 .4rem .4rem 0; padding:.7rem .85rem; font-size:.86rem; line-height:1.65; }
.mx-rv .ka { font-size:.72rem; color:var(--mx-mut); }
.mx-rv .aa { color:var(--mx-ok); font-weight:600; }
.mx-rv .pp { color:var(--mx-no); }
.mx-list { display:grid; gap:.6rem; margin-top:1rem; text-align:left; }
</style>

<div class="mex" id="mex"></div>

<script>
(function () {
  var raw = document.getElementById('pt-exam-data');
  var E = window.PTExam;
  if (!raw || !E) return;
  E.init(JSON.parse(raw.textContent));

  var KEY = 'pharmtech-exam-v1';
  var root = document.getElementById('mex');
  function get() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function put(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }
  var store = get();
  store.runs = store.runs || [];
  store.wrong = store.wrong || [];

  var S = null, timer = null;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function fmt(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }
  function mmss(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* ── 시작 화면 ─────────────────────────────────────────── */
  function home() {
    if (timer) { clearInterval(timer); timer = null; }
    var last = store.runs.slice(-5).reverse();
    var html = '<div class="mx-start">';
    html += '<div class="mx-modes">';
    html += '<button class="mx-mode" data-m="full"><b>실전 모의고사 · 90문항</b><small>110분 타이머. 실제 시험과 같은 문항 수와 도메인 비중으로 출제됩니다.</small></button>';
    html += '<button class="mx-mode" data-m="half"><b>하프 모의고사 · 45문항</b><small>55분. 시간이 없을 때 비중은 그대로 유지한 축소판입니다.</small></button>';
    html += '<button class="mx-mode" data-m="quick"><b>빠른 점검 · 20문항</b><small>타이머 없이 감만 확인합니다.</small></button>';
    if (store.wrong.length) {
      html += '<button class="mx-mode" data-m="review"><b>틀린 문제 다시 · ' + store.wrong.length + '문항</b><small>지금까지 틀린 문항만 모아 다시 풉니다. 계산 문항은 새 숫자로 나옵니다.</small></button>';
    }
    html += '</div>';
    html += '<div class="mx-sub"><span class="mx-meta">도메인 집중:</span>'
      + [1, 2, 3, 4].map(function (d) {
          return '<button class="mx-chip" data-d="' + d + '">' + esc(E.name(d)) + ' 20문항</button>';
        }).join('') + '</div>';

    if (last.length) {
      html += '<div class="mx-hist"><b>최근 응시</b><br>' + last.map(function (r) {
        return r.at + ' · ' + r.mode + ' · ' + r.ok + '/' + r.total
          + ' (' + r.pct + '%, 척도 ' + r.scaled + ') ' + (r.pass ? '합격선 이상' : '합격선 미만');
      }).join('<br>') + '</div>';
    }
    html += '<div class="mx-hist">문제은행 ' + E.count() + '문항 + 계산 생성 문항. 진행 기록은 이 브라우저에만 저장됩니다.</div>';
    html += '</div>';
    root.innerHTML = html;

    Array.prototype.forEach.call(root.querySelectorAll('[data-m]'), function (b) {
      b.onclick = function () { start(b.dataset.m); };
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-d]'), function (b) {
      b.onclick = function () { start('domain', +b.dataset.d); };
    });
  }

  function start(mode, d) {
    var set, secs = 0, label = '';
    if (mode === 'full') { set = E.build(90); secs = 110 * 60; label = '실전 90문항'; }
    else if (mode === 'half') { set = E.build(45); secs = 55 * 60; label = '하프 45문항'; }
    else if (mode === 'quick') { set = E.build(20); label = '빠른 점검 20문항'; }
    else if (mode === 'review') { set = E.reviewSet(store.wrong, 30); label = '틀린 문제 다시'; }
    else { set = E.byDomainSet(d, 20); label = E.name(d) + ' 20문항'; }
    if (!set.length) return home();

    S = { mode: mode, label: label, set: set, i: 0, ans: new Array(set.length).fill(-1),
          flag: {}, left: secs, done: false };
    if (secs) {
      timer = setInterval(function () {
        if (!S || S.done) return;
        S.left--;
        var t = document.getElementById('mx-time');
        if (t) { t.textContent = mmss(S.left); t.classList.toggle('warn', S.left <= 300); }
        if (S.left <= 0) submit(true);
      }, 1000);
    }
    draw();
  }

  /* ── 문항 화면 ─────────────────────────────────────────── */
  function draw() {
    var q = S.set[S.i], n = S.set.length;
    var answered = S.ans.filter(function (x) { return x >= 0; }).length;
    var html = '';
    html += '<div class="mx-bar"><span class="mx-meta">' + esc(S.label) + '</span>'
      + (S.left ? '<span class="mx-time" id="mx-time">' + mmss(S.left) + '</span>' : '<span class="mx-meta">타이머 없음</span>')
      + '<span class="mx-meta">답한 문항 ' + answered + ' / ' + n + '</span>'
      + '<button class="mx-btn ghost" id="mx-submit">제출하고 채점</button></div>';

    html += '<div class="mx-card">';
    html += '<div class="mx-top"><span>' + (S.i + 1) + ' / ' + n + '</span>'
      + '<span>' + esc(E.name(q.d)) + ' · ' + esc(q.ka) + (q.gen ? ' · 숫자 자동 생성' : '') + '</span></div>';
    html += '<div class="mx-q">' + fmt(q.q) + '</div>';
    html += '<div class="mx-opts">' + q.c.map(function (c, i) {
      return '<button class="mx-opt' + (S.ans[S.i] === i ? ' sel' : '') + '" data-i="' + i + '">'
        + '<b>' + 'ABCD'[i] + '</b><span>' + fmt(c) + '</span></button>';
    }).join('') + '</div>';
    html += '<div class="mx-nav"><div>'
      + '<button class="mx-btn ghost" id="mx-prev"' + (S.i === 0 ? ' disabled' : '') + '>이전</button> '
      + '<button class="mx-btn flag' + (S.flag[S.i] ? ' on' : '') + '" id="mx-flag">나중에 볼 문항</button></div>'
      + '<button class="mx-btn" id="mx-next">' + (S.i === n - 1 ? '마지막 문항' : '다음') + '</button></div>';
    html += '<div class="mx-pal">' + S.set.map(function (_, i) {
      var cls = 'mx-p' + (S.ans[i] >= 0 ? ' done' : '') + (S.flag[i] ? ' flag' : '') + (i === S.i ? ' cur' : '');
      return '<button class="' + cls + '" data-p="' + i + '">' + (i + 1) + '</button>';
    }).join('') + '</div>';
    html += '</div>';
    root.innerHTML = html;

    Array.prototype.forEach.call(root.querySelectorAll('.mx-opt'), function (b) {
      b.onclick = function () {
        S.ans[S.i] = b.dataset.i | 0;
        if (S.i < S.set.length - 1) { S.i++; draw(); } else draw();
      };
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-p]'), function (b) {
      b.onclick = function () { S.i = b.dataset.p | 0; draw(); };
    });
    document.getElementById('mx-prev').onclick = function () { if (S.i > 0) { S.i--; draw(); } };
    document.getElementById('mx-next').onclick = function () { if (S.i < S.set.length - 1) { S.i++; draw(); } };
    document.getElementById('mx-flag').onclick = function () { S.flag[S.i] = !S.flag[S.i]; draw(); };
    document.getElementById('mx-submit').onclick = function () { submit(false); };
  }

  /* ── 채점 ──────────────────────────────────────────────── */
  function submit(auto) {
    var left = S.ans.filter(function (x) { return x < 0; }).length;
    if (!auto && left && !confirm('답하지 않은 문항이 ' + left + '개 있습니다. 제출할까요?')) return;
    S.done = true;
    if (timer) { clearInterval(timer); timer = null; }
    var g = E.grade(S.set, S.ans);

    // 오답 누적 — 생성 문항은 유형 이름으로 저장해 새 숫자로 다시 나오게 한다
    var w = {};
    store.wrong.forEach(function (id) { w[id] = 1; });
    g.wrong.forEach(function (x) { w[x.q.gen ? 'gen:' + x.q.gen : x.q.id] = 1; });
    S.set.forEach(function (q, i) {
      if (S.ans[i] === q.a) delete w[q.gen ? 'gen:' + q.gen : q.id];
    });
    store.wrong = Object.keys(w).map(function (k) { return /^\d+$/.test(k) ? +k : k; });
    store.runs.push({ at: new Date().toISOString().slice(0, 10), mode: S.label,
                      ok: g.ok, total: g.total, pct: g.pct, scaled: g.scaled, pass: g.pass });
    if (store.runs.length > 30) store.runs = store.runs.slice(-30);
    put(store);

    var html = '<div class="mx-card"><div class="mx-res">';
    html += '<div class="mx-score ' + (g.pass ? 'pass' : 'fail') + '">' + g.pct + '%</div>';
    html += '<div class="mx-scale">' + g.ok + ' / ' + g.total + ' 정답 · 척도 점수 근사 <b>' + g.scaled + '</b>'
      + ' (합격선 1400) — ' + (g.pass ? '합격선 이상' : '합격선 미만') + '</div>';
    if (auto) html += '<div class="mx-scale" style="color:var(--mx-no)">시간이 끝나 자동 제출되었습니다.</div>';
    html += '</div>';

    html += '<div class="mx-dom">' + [1, 2, 3, 4].map(function (d) {
      var p = g.per[d], pct = p.n ? Math.round(p.ok / p.n * 100) : 0;
      return '<div class="mx-drow"><span>' + esc(E.name(d)) + '</span>'
        + '<span class="mx-dbar"><i class="' + (pct < 70 ? 'low' : '') + '" style="width:' + pct + '%"></i></span>'
        + '<span>' + p.ok + ' / ' + p.n + ' · ' + pct + '%</span></div>';
    }).join('') + '</div>';

    if (g.wrong.length) {
      html += '<div class="mx-list">' + g.wrong.map(function (x) {
        return '<div class="mx-rv"><div class="ka">' + esc(E.name(x.q.d)) + ' · ' + esc(x.q.ka) + '</div>'
          + '<div style="font-weight:600;margin:.25rem 0">' + fmt(x.q.q) + '</div>'
          + '<div class="aa">정답: ' + fmt(x.q.c[x.q.a]) + '</div>'
          + (x.picked >= 0 ? '<div class="pp">내 답: ' + fmt(x.q.c[x.picked]) + '</div>' : '<div class="pp">답하지 않음</div>')
          + '<div style="color:var(--mx-mut);margin-top:.3rem">' + fmt(x.q.e) + '</div></div>';
      }).join('') + '</div>';
    } else {
      html += '<p style="text-align:center;color:var(--mx-ok);font-weight:600;margin-top:1rem">전 문항 정답입니다.</p>';
    }

    html += '<div class="mx-nav" style="justify-content:center"><button class="mx-btn" id="mx-again">새 시험 보기</button></div>';
    html += '</div>';
    root.innerHTML = html;
    document.getElementById('mx-again').onclick = home;
    window.scrollTo({ top: root.offsetTop - 60, behavior: 'smooth' });
  }

  document.addEventListener('keydown', function (e) {
    if (!S || S.done || !root.querySelector('.mx-opt')) return;
    var k = e.key.toUpperCase();
    if ('ABCD'.indexOf(k) >= 0) {
      var b = root.querySelector('.mx-opt[data-i="' + 'ABCD'.indexOf(k) + '"]');
      if (b) { e.preventDefault(); b.click(); }
    } else if (e.key === 'ArrowRight') { if (S.i < S.set.length - 1) { S.i++; draw(); } }
    else if (e.key === 'ArrowLeft') { if (S.i > 0) { S.i--; draw(); } }
  });

  home();
})();
</script>
