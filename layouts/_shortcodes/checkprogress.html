<div class="ptc" id="ptc"></div>

<script>
(function () {
  var KEY = 'pharmtech-checklist-v1';
  var root = document.getElementById('ptc');
  if (!root) return;

  function get() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }

  /* 항목 텍스트로 키를 만든다 — 순서가 바뀌어도 체크가 따라간다 */
  function hash(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return 'i' + (h >>> 0).toString(36);
  }
  function keyOf(li) {
    return hash(li.textContent.replace(/\s+/g, ' ').trim().slice(0, 120));
  }

  function run() {
    var content = document.querySelector('.content') || document.body;
    var boxes = content.querySelectorAll('li > input[type="checkbox"]');
    if (!boxes.length) return;

    var st = get(); st.items = st.items || {};
    var items = [];

    Array.prototype.forEach.call(boxes, function (b) {
      var li = b.parentElement;
      var k = keyOf(li);
      li.classList.add('ptc-item');
      b.disabled = false;
      b.checked = !!st.items[k];
      li.classList.toggle('ptc-on', b.checked);
      b.setAttribute('data-k', k);
      items.push({ li: li, box: b, k: k });

      b.addEventListener('change', function () {
        var s = get(); s.items = s.items || {};
        if (b.checked) s.items[k] = new Date().toISOString().slice(0, 10);
        else delete s.items[k];
        s.at = new Date().toISOString().slice(0, 10);
        set(s);
        li.classList.toggle('ptc-on', b.checked);
        paint();
      });
      // 텍스트를 눌러도 토글되게
      li.addEventListener('click', function (e) {
        if (e.target === b || e.target.closest('a')) return;
        b.checked = !b.checked;
        b.dispatchEvent(new Event('change'));
      });
    });

    /* 단계(h2)별 진행 표시 */
    var groups = [];
    content.querySelectorAll('h2').forEach(function (h) {
      var list = h.nextElementSibling;
      while (list && list.tagName !== 'UL' && list.tagName !== 'H2') list = list.nextElementSibling;
      if (!list || list.tagName !== 'UL') return;
      var bs = list.querySelectorAll('li > input[type="checkbox"]');
      if (!bs.length) return;
      var tag = document.createElement('span');
      tag.className = 'ptc-count';
      h.appendChild(tag);
      groups.push({ tag: tag, boxes: bs });
    });

    function paint() {
      var done = items.filter(function (x) { return x.box.checked; }).length;
      var pct = Math.round(done / items.length * 100);
      var s = get();
      root.innerHTML =
        '<div class="ptc-head"><div class="ptc-pct">' + pct + '%</div>'
        + '<div class="ptc-sum"><b>' + done + ' / ' + items.length + '</b> 항목 완료'
        + '<small>' + (s.at ? '마지막 변경 ' + s.at + ' · ' : '') + '체크는 이 브라우저에만 저장됩니다</small></div>'
        + '<button class="ptc-btn" id="ptc-reset">전체 해제</button></div>'
        + '<div class="ptc-bar"><i style="width:' + pct + '%"></i></div>';
      document.getElementById('ptc-reset').onclick = function () {
        if (!confirm('체크한 항목을 모두 지웁니다. 계속할까요?')) return;
        var s2 = get(); s2.items = {}; set(s2);
        items.forEach(function (x) { x.box.checked = false; x.li.classList.remove('ptc-on'); });
        paint();
      };
      groups.forEach(function (g) {
        var n = 0;
        Array.prototype.forEach.call(g.boxes, function (b) { if (b.checked) n++; });
        g.tag.textContent = n + ' / ' + g.boxes.length;
        g.tag.classList.toggle('done', n === g.boxes.length);
      });
    }

    paint();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();
</script>
