<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="눈과 귀 약어 구분">
  <text x="20" y="30" class="f-cap">환자를 마주 본 상태 — 환자의 오른쪽은 내 왼쪽입니다</text>

  <ellipse cx="410" cy="170" rx="104" ry="112" class="f-face"/>
  <ellipse cx="308" cy="170" rx="20" ry="32" class="f-ear"/>
  <ellipse cx="512" cy="170" rx="20" ry="32" class="f-ear"/>
  <ellipse cx="370" cy="146" rx="25" ry="15" class="f-eye"/>
  <circle cx="370" cy="146" r="6" class="f-pupil"/>
  <ellipse cx="450" cy="146" rx="25" ry="15" class="f-eye"/>
  <circle cx="450" cy="146" r="6" class="f-pupil"/>
  <path d="M386 208 Q410 224 434 208" class="f-line"/>

  <!-- 왼쪽 = 환자의 오른쪽 -->
  <path d="M232 122 H308 V142" class="f-line"/>
  <text x="24" y="127" class="f-tag"><tspan class="f-key">AD</tspan><tspan dx="14">우이 — right ear</tspan></text>
  <path d="M232 176 H344" class="f-line"/>
  <text x="24" y="181" class="f-tag"><tspan class="f-key">OD</tspan><tspan dx="14">우안 — right eye</tspan></text>
  <text x="24" y="212" class="f-mut2">d = dexter(오른쪽)</text>

  <!-- 오른쪽 = 환자의 왼쪽 -->
  <path d="M512 142 V122 H592" class="f-line"/>
  <text x="600" y="127" class="f-tag"><tspan class="f-key">AS</tspan><tspan dx="14">좌이 — left ear</tspan></text>
  <path d="M476 176 H592" class="f-line"/>
  <text x="600" y="181" class="f-tag"><tspan class="f-key">OS</tspan><tspan dx="14">좌안 — left eye</tspan></text>
  <text x="600" y="212" class="f-tag"><tspan class="f-key">OU</tspan><tspan dx="14">양안 — both eyes</tspan></text>
  <text x="600" y="236" class="f-tag"><tspan class="f-key">AU</tspan><tspan dx="14">양이 — both ears</tspan></text>

  <rect x="16" y="268" width="788" height="36" rx="8" class="f-warn"/>
  <text x="32" y="291" class="f-note f-warn-t">o = oculus(눈) · a = auris(귀) — 첫 글자 하나가 안약을 귀에 넣게 만듭니다. 라벨에는 eye / ear로 풀어 씁니다.</text>
</svg>
