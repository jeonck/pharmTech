<svg viewBox="0 0 820 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="제형에 따른 라벨 동사">
  <text x="20" y="30" class="f-cap">제형이 동사를 결정합니다 — 여기서 틀리면 라벨 전체가 어색해집니다</text>

  <g transform="translate(16,52)">
    <rect width="192" height="112" rx="10" class="f-box"/>
    <ellipse cx="40" cy="46" rx="19" ry="12" class="f-pill"/>
    <path d="M21 46 H59" class="f-line"/>
