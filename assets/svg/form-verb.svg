    <text x="72" y="60" class="f-verb2">Instill</text>
    <text x="72" y="84" class="f-mut2">in both eyes</text>
  </g>

  <g transform="translate(616,52)">
    <rect width="188" height="112" rx="10" class="f-box"/>
    <rect x="26" y="26" width="24" height="34" rx="5" class="f-pill"/>
