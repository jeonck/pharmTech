    <text x="72" y="68" class="f-verb2">Insert</text>
    <text x="72" y="92" class="f-mut2">rectally</text>
  </g>

  <g transform="translate(216,180)">
    <rect width="192" height="112" rx="10" class="f-box"/>
    <path d="M22 62 L58 26 M32 48 l14 14 M44 36 l14 14" class="f-needle2"/>
