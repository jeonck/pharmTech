    <text x="72" y="60" class="f-verb2">Take</text>
    <text x="72" y="84" class="f-mut2">by mouth</text>
  </g>

  <g transform="translate(216,52)">
    <rect width="192" height="112" rx="10" class="f-box"/>
    <path d="M22 54 h32 l14 -13 h6 v32 h-6 l-14 -13 h-32 z" class="f-pill"/>
